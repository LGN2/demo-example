name: Verify application
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        java: ["17", "21"]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: bayt_test
          MYSQL_USER: bayt
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://localhost:3306/bayt_test?connectionTimeZone=UTC
      DB_USER: bayt
      DB_PASSWORD: test-only-password
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  browser:
    runs-on: ubuntu-latest
    needs: verify
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: bayt_demo
          MYSQL_USER: bayt
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://localhost:3306/bayt_demo?connectionTimeZone=UTC
      DB_USER: bayt
      DB_PASSWORD: test-only-password
      SPRING_PROFILES_ACTIVE: dev
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh mvnw -B -DskipTests package
      - run: |
          java -jar target/property-management-1.0.0-SNAPSHOT.jar > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat app.log
          exit 1
      - run: npm ci --prefix tests/browser && npx --prefix tests/browser playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            tests/browser/artifacts/
            app.log
