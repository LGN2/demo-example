spring:
  application:
    name: bayt
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bayt?connectionTimeZone=UTC}
    username: ${DB_USER:bayt}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
app:
  storage: ${STORAGE_PATH:./storage}
  upload-scan-command: ${UPLOAD_SCAN_COMMAND:}
  ai:
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    timeout-seconds: 12
